[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linksmith"
version = "0.1.0"
description = "Spec-driven workflow utilities for LinkSmith services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chevron>=0.14.0",
  "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
